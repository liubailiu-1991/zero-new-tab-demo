<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZERO 新标签页 - 需求探索工作台 V4</title>
  <link rel="icon" href="assets/figma/tabbar/ai-assistant.svg">
  <style>
    :root {
      --topbar-h: 44px;
      --left-w: 252px;
      --right-w: 344px;
      --bg: #d9dde2;
      --panel: #f7f8fa;
      --panel-strong: #ffffff;
      --canvas: #24272c;
      --canvas-grid: #2d3137;
      --text: #242a33;
      --muted: #737b87;
      --line: #d6dae0;
      --line-strong: #bcc2ca;
      --accent: #2867d8;
      --accent-soft: #e9f0ff;
      --done: #228052;
      --wait: #b66a15;
      --danger: #b53931;
      --shadow: 0 18px 46px rgba(17, 24, 34, 0.24);
      --radius: 7px;
      --type-ui: 14px;
      --type-ui-line: 20px;
      --type-aux: 12px;
      --type-aux-line: 18px;
      --control-h: 34px;
      --icon-control: 34px;
      --focus-ring: 0 0 0 3px rgba(40, 103, 216, 0.24);
      --disabled: #a8afb8;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: var(--topbar-h) minmax(0, 1fr);
    }

    .topbar {
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 9px 0 13px;
      border-bottom: 1px solid #30343a;
      background: #202328;
      color: #e7e9ed;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 650;
    }

    .brand-mark {
      width: 21px;
      height: 21px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: #eef1f5;
      color: #1a1d22;
      font-size: 10px;
      font-weight: 800;
    }

    .brand-version {
      color: #969da8;
      font-size: 11px;
      font-weight: 500;
    }

    .actions, .toolbar-group, .module-main, .section-heading, .status-line {
      display: flex;
      align-items: center;
    }

    .actions, .toolbar-group { gap: 4px; }

    .icon-btn, .text-btn {
      height: 29px;
      border: 1px solid transparent;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 8px;
      background: transparent;
      cursor: pointer;
      font-size: 11px;
    }

    .icon-btn { width: 29px; padding: 0; }
    .icon-btn svg, .text-btn svg { width: 15px; height: 15px; stroke-width: 1.8; }
    .icon-btn:hover, .text-btn:hover { background: rgba(119, 127, 139, 0.13); }
    .topbar .icon-btn { color: #c6cbd3; }
    .topbar .icon-btn:hover { border-color: #454a52; background: #30343a; color: #fff; }
    .topbar .icon-btn[aria-pressed="true"] { border-color: #466391; background: #304567; color: #fff; }
    .topbar .text-btn { color: #dfe3e9; text-decoration: none; }
    .topbar .text-btn:hover { border-color: #454a52; background: #30343a; color: #fff; }

    .workspace {
      min-height: 0;
      display: grid;
      position: relative;
      grid-template-columns: minmax(218px, var(--left-w)) 8px minmax(0, 1fr) 8px minmax(286px, var(--right-w));
    }

    .pane { min-width: 0; min-height: 0; overflow: hidden; background: var(--panel); }
    .left-pane { display: grid; grid-template-rows: auto auto minmax(0, 1fr); border-right: 1px solid var(--line); }
    .right-pane { display: grid; grid-template-rows: auto minmax(0, 1fr); border-left: 1px solid var(--line); }
    .center-pane { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--canvas); }

    .resizer { position: relative; z-index: 10; cursor: col-resize; background: #aeb4bd; }
    .resizer::after { content: ""; position: absolute; inset: 0 1px; }
    .resizer:hover::after, .resizer.is-dragging::after { background: var(--accent); }

    body.left-hidden .workspace { grid-template-columns: 0 0 minmax(0, 1fr) 8px minmax(286px, var(--right-w)); }
    body.right-hidden .workspace { grid-template-columns: minmax(218px, var(--left-w)) 8px minmax(0, 1fr) 0 0; }
    body.left-hidden.right-hidden .workspace { grid-template-columns: 0 0 minmax(0, 1fr) 0 0; }
    body.left-hidden .left-pane, body.left-hidden .left-resizer,
    body.right-hidden .right-pane, body.right-hidden .right-resizer { visibility: hidden; pointer-events: none; }
    body.left-hidden .left-resizer, body.right-hidden .right-resizer { display: none; }

    .pane-head {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 9px 8px 13px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-strong);
    }

    .pane-title { min-width: 0; }
    .pane-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .pane-title span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }

    .search-area { padding: 9px; border-bottom: 1px solid var(--line); }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 9px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search-input {
      width: 100%;
      height: 31px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 9px 0 29px;
      outline: none;
      background: #fff;
      color: var(--text);
      font-size: 11px;
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(40, 103, 216, 0.11); }

    .feature-scroll, .inspector-scroll { min-height: 0; overflow: auto; }
    .feature-scroll { padding: 8px 7px 24px; }
    .feature-tree, .feature-tree ul { margin: 0; padding: 0; list-style: none; }
    .feature-group + .feature-group { margin-top: 5px; }

    .group-button, .module-button {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 6px;
      display: grid;
      align-items: center;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .group-button {
      min-height: 29px;
      grid-template-columns: 17px minmax(0, 1fr) auto;
      gap: 4px;
      padding: 3px 6px;
      color: #555e6b;
      font-size: 11px;
      font-weight: 700;
    }

    .module-button {
      min-height: 32px;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      margin-top: 1px;
      padding: 4px 7px 4px 25px;
      color: #3f4753;
      font-size: 11px;
    }

    .group-button:hover, .module-button:hover { background: #eceff3; }
    .module-button.is-active { border-color: rgba(40, 103, 216, 0.22); background: var(--accent-soft); color: #1f4f9e; }
    .chevron { width: 14px; height: 14px; display: grid; place-items: center; color: #737b87; }
    .chevron svg { width: 12px; height: 12px; transition: transform 120ms ease; }
    .group-button[aria-expanded="false"] .chevron svg { transform: rotate(-90deg); }
    .feature-children[hidden] { display: none; }
    .module-main { min-width: 0; gap: 7px; }
    .module-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--wait); }
    .status-dot.done { background: var(--done); }
    .question-count { min-width: 17px; height: 17px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; background: #e3e7ec; color: #737b87; font-size: 9px; }
    .module-button.is-active .question-count { background: #d8e5ff; color: #2457ad; }
    .empty-tree { padding: 24px 10px; color: var(--muted); text-align: center; font-size: 11px; }

    .canvas-toolbar {
      min-height: 54px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      grid-template-areas: "title state viewport zoom";
      align-items: center;
      gap: 12px;
      padding: 6px 9px 6px 13px;
      border-bottom: 1px solid #b7bdc5;
      background: #f4f5f7;
    }

    .canvas-title { min-width: 0; grid-area: title; }
    .breadcrumb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 9px; }
    .canvas-title-line { min-width: 0; display: flex; align-items: center; gap: 7px; margin-top: 2px; }
    .canvas-title-line h1 { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 1.3; }
    .selection-chip { flex: 0 0 auto; border-radius: 10px; padding: 2px 7px; background: #e8edf4; color: #606977; font-size: 9px; }
    .selection-chip.element { background: #e9f0ff; color: #2457ad; }

    .viewport-select {
      height: 29px;
      border: 1px solid #cfd4db;
      border-radius: 6px;
      padding: 0 27px 0 8px;
      outline: none;
      background: #fff;
      color: #3e4753;
      font-size: 10px;
      cursor: pointer;
    }
    .viewport-select:focus { border-color: var(--accent); }
    .popup-state-select { min-width: 156px; grid-area: state; }
    #viewport-select { grid-area: viewport; }
    .canvas-toolbar > .toolbar-group { grid-area: zoom; }
    .zoom-value { min-width: 45px; }

    @media (max-width: 1200px) {
      .canvas-toolbar {
        min-height: 86px;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "title zoom" "state viewport";
        gap: 6px 10px;
      }
    }

    @media (max-width: 900px) {
      .canvas-toolbar {
        min-height: 116px;
        grid-template-areas: "title title" "state viewport" "zoom zoom";
      }
      .canvas-toolbar > .toolbar-group { justify-self: end; }
    }

    .canvas-scroll {
      position: relative;
      min-height: 0;
      overflow: auto;
      background-color: var(--canvas);
      background-image: radial-gradient(var(--canvas-grid) 0.75px, transparent 0.75px);
      background-size: 18px 18px;
    }

    .canvas-viewport { min-width: 100%; min-height: 100%; display: grid; place-items: center; padding: 30px; }
    .scale-wrap { position: relative; width: max-content; height: max-content; }

    .prototype-frame {
      position: relative;
      width: 1440px;
      height: 813px;
      overflow: hidden;
      border: 1px solid #11161d;
      border-radius: 8px;
      background: #cdd6de;
      box-shadow: 0 22px 58px rgba(0, 0, 0, 0.34);
      isolation: isolate;
      transform-origin: top left;
    }

    .prototype-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #7db8d6;
    }

    .wallpaper {
      position: absolute;
      inset: 0;
      border: 0;
      padding: 0;
      background: url("assets/latest-cloud-field-wallpaper.jpg") center center / cover no-repeat;
      cursor: pointer;
    }
    .wallpaper::after { content: ""; position: absolute; inset: 0; background: rgba(8, 22, 31, 0.06); }

    .browser-bar {
      position: absolute;
      z-index: 20;
      inset: 0 0 auto;
      height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 11px;
      border: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.48);
      background: rgba(224, 236, 243, 0.77);
      backdrop-filter: blur(18px) saturate(1.08);
      color: #3a4653;
      cursor: pointer;
    }

    .browser-bar.is-selected-surface { box-shadow: inset 0 -3px 0 var(--accent); }
    .browser-nav { display: flex; align-items: center; gap: 2px; }
    .nav-icon { width: 28px; height: 30px; display: grid; place-items: center; border-radius: 6px; }
    .nav-icon svg { width: 15px; height: 15px; }
    .tab-strip { min-width: 0; flex: 1; display: flex; align-items: center; gap: 7px; }
    .browser-tab {
      min-width: 150px;
      max-width: 270px;
      height: 34px;
      flex: 1 1 190px;
      border: 1px solid rgba(255, 255, 255, 0.54);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      background: rgba(255, 255, 255, 0.35);
      color: #53606e;
      font-size: 11px;
    }
    .browser-tab.active { background: rgba(255, 255, 255, 0.9); color: #2b3541; }
    .browser-tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .browser-actions { display: flex; align-items: center; gap: 4px; }
    .scene-icon-btn {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.52);
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.36);
      color: #394655;
      cursor: pointer;
    }
    .scene-icon-btn:hover, .scene-icon-btn.is-active { background: rgba(255, 255, 255, 0.92); }
    .scene-icon-btn.is-selected-surface { outline: 3px solid rgba(40, 103, 216, 0.42); outline-offset: 2px; }
    .scene-icon-btn svg { width: 16px; height: 16px; }

    .search-box {
      position: absolute;
      z-index: 8;
      left: 50%;
      top: 54px;
      width: min(480px, 36%);
      height: 44px;
      transform: translateX(-50%);
      border: 1px solid rgba(255, 255, 255, 0.84);
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 15px;
      background: rgba(255, 255, 255, 0.9);
      color: #6c7581;
      box-shadow: 0 14px 34px rgba(17, 28, 38, 0.16);
      backdrop-filter: blur(10px);
      cursor: pointer;
    }
    .search-box.is-selected-surface { outline: 3px solid rgba(40, 103, 216, 0.46); outline-offset: 3px; }
    .search-box svg { width: 17px; height: 17px; }
    .search-copy { flex: 1; text-align: left; font-size: 12px; }
    .search-tools { display: flex; align-items: center; gap: 6px; }
    .search-tool { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: #525e6d; }

    .search-suggestions {
      position: absolute;
      z-index: 9;
      left: 50%;
      top: 106px;
      width: min(480px, 36%);
      transform: translateX(-50%);
      border: 1px solid rgba(207, 214, 222, 0.88);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 16px 38px rgba(17, 28, 38, 0.2);
    }
    .suggestion { min-height: 38px; display: flex; align-items: center; gap: 9px; padding: 0 13px; border-bottom: 1px solid #edf0f3; color: #4e5865; font-size: 11px; }
    .suggestion:last-child { border-bottom: 0; }

    .folder-rail {
      position: absolute;
      z-index: 10;
      left: 22px;
      right: 22px;
      bottom: 108px;
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      padding: 4px 5px;
      border-radius: 7px;
      background: rgba(22, 31, 35, 0.28);
      backdrop-filter: blur(7px);
      cursor: pointer;
    }
    .folder-rail.is-selected-surface { outline: 3px solid rgba(40, 103, 216, 0.52); outline-offset: 2px; }
    .folder-chip { height: 26px; flex: 0 0 auto; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 5px; display: inline-flex; align-items: center; gap: 5px; padding: 0 9px; background: rgba(255, 255, 255, 0.12); color: #fff; font-size: 10px; }

    .dock {
      position: absolute;
      z-index: 11;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 98px;
      display: flex;
      align-items: end;
      gap: 12px;
      padding: 11px 20px 16px;
      border: 0;
      background: rgba(15, 23, 27, 0.6);
      backdrop-filter: blur(13px) saturate(1.06);
      cursor: pointer;
    }
    .dock.is-selected-surface { box-shadow: inset 0 3px 0 var(--accent); }
    .dock-logo {
      position: relative;
      width: 56px;
      border: 0;
      display: grid;
      justify-items: center;
      gap: 4px;
      padding: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 10px;
    }
    .dock-logo-icon { width: 48px; height: 48px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-size: 16px; font-weight: 750; transition: transform 120ms ease; }
    .dock-logo:hover .dock-logo-icon { transform: translateY(-4px); }
    .dock-logo.is-selected-surface .dock-logo-icon { outline: 3px solid rgba(98, 157, 255, 0.86); outline-offset: 3px; }
    .dock-count { position: absolute; top: -5px; right: 0; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; background: #2f73eb; color: #fff; font-size: 9px; }
    .dock-actions { margin-left: auto; align-self: center; display: flex; align-items: center; gap: 5px; }
    .dock-action { width: 31px; height: 31px; border: 1px solid rgba(255, 255, 255, 0.13); border-radius: 6px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.1); color: #fff; cursor: pointer; }
    .dock-action:hover, .dock-action.is-active, .dock-action.is-selected-surface { background: rgba(255, 255, 255, 0.22); }
    .dock-action svg { width: 14px; height: 14px; }

    .floating-panel {
      position: absolute;
      z-index: 30;
      border: 1px solid #cbd1d8;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: var(--shadow);
      color: #29323d;
    }
    .floating-panel.is-selected-surface { outline: 3px solid rgba(40, 103, 216, 0.45); outline-offset: 3px; }
    .floating-head { min-height: 43px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 13px; border-bottom: 1px solid #dce1e6; background: #f7f8fa; font-size: 12px; font-weight: 700; }
    .floating-head small { color: #7a828d; font-size: 9px; font-weight: 500; }
    .floating-body { padding: 13px; }

    .save-panel { top: 79px; right: 24px; width: 365px; }
    .form-field {
      width: 100%;
      min-height: 38px;
      border: 1px solid #d5dae0;
      border-radius: 6px;
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
      padding: 0 9px;
      background: #fff;
      color: #4f5966;
      cursor: pointer;
      text-align: left;
      font-size: 10px;
    }
    .form-field:hover, .form-field.is-selected-element { border-color: #6e9cee; box-shadow: 0 0 0 2px rgba(40, 103, 216, 0.1); }
    .field-label { color: #858d98; }
    .field-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag-editor { width: 100%; border: 1px solid #d5dae0; border-radius: 6px; margin-bottom: 8px; padding: 8px 9px; background: #fff; cursor: pointer; text-align: left; }
    .tag-editor:hover, .tag-editor.is-selected-element { border-color: #6e9cee; box-shadow: 0 0 0 2px rgba(40, 103, 216, 0.1); }
    .field-caption { display: block; margin-bottom: 7px; color: #858d98; font-size: 10px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { min-height: 23px; border: 1px solid #d8dde3; border-radius: 12px; display: inline-flex; align-items: center; padding: 0 8px; background: #f2f4f6; color: #586270; font-size: 9px; }
    .popup-status { display: flex; align-items: center; gap: 8px; min-height: 38px; margin-bottom: 8px; padding: 0 9px; border: 1px solid #cfe6d6; border-radius: 6px; background: #f1fbf4; color: #25643a; font-size: 10px; font-weight: 650; }
    .popup-status svg { width: 15px; height: 15px; }
    .popup-search { width: 100%; height: 34px; margin-bottom: 8px; border: 1px solid #d5dae0; border-radius: 6px; display: flex; align-items: center; gap: 7px; padding: 0 9px; background: #fff; color: #8a929c; font-size: 10px; }
    .popup-search svg { width: 14px; height: 14px; }
    .popup-tag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .popup-tag-option { min-height: 30px; border: 1px solid #d8dde3; border-radius: 6px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #fff; color: #5b6571; font-size: 9px; }
    .popup-tag-option.is-on { border-color: #9db9ec; background: #edf4ff; color: #2457ad; }
    .popup-footer { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding-top: 10px; border-top: 1px solid #e2e6ea; }
    .popup-link, .popup-done { height: 34px; border-radius: 6px; cursor: pointer; font-size: 10px; }
    .popup-link { border: 1px solid transparent; padding: 0 7px; text-align: left; background: transparent; color: #a43f3f; }
    .popup-link:hover, .popup-link.is-selected-element { background: #fff1f1; }
    .popup-done { min-width: 72px; border: 0; padding: 0 14px; background: var(--accent); color: #fff; font-weight: 650; }
    .popup-done:hover, .popup-done.is-selected-element { background: #235bc0; box-shadow: 0 0 0 3px rgba(40, 103, 216, 0.18); }
    .primary-action { width: 100%; height: 36px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; font-weight: 650; font-size: 11px; }
    .primary-action:hover, .primary-action.is-selected-element { background: #235bc0; box-shadow: 0 0 0 3px rgba(40, 103, 216, 0.18); }

    function refreshIcons() {
      if (window.lucide) window.lucide.createIcons();
      prepareTooltips();
    }

    function prepareTooltips(root = document) {
      root.querySelectorAll("button[title], a[title], [role='button'][title], [data-tooltip]").forEach((element) => {
        if (!element.dataset.tooltip) element.dataset.tooltip = element.getAttribute("aria-label") || element.getAttribute("title") || "";
        if (!element.getAttribute("aria-label") && element.dataset.tooltip) element.setAttribute("aria-label", element.dataset.tooltip);
        element.removeAttribute("title");
        if (element.dataset.tooltipBound === "true") return;
        element.dataset.tooltipBound = "true";
        element.addEventListener("mouseenter", () => showTooltip(element));
        element.addEventListener("mouseleave", hideTooltip);
        element.addEventListener("focus", () => showTooltip(element));
        element.addEventListener("blur", hideTooltip);
      });
    }

    function showTooltip(target) {
      const copy = target.dataset.tooltip;
      if (!copy) return;
      uiTooltip.textContent = copy;
      uiTooltip.hidden = false;
      const targetRect = target.getBoundingClientRect();
      const tooltipRect = uiTooltip.getBoundingClientRect();
      const left = Math.max(8, Math.min(targetRect.left + targetRect.width / 2 - tooltipRect.width / 2, window.innerWidth - tooltipRect.width - 8));
      const preferredTop = targetRect.bottom + 8;
      const top = preferredTop + tooltipRect.height <= window.innerHeight - 8 ? preferredTop : Math.max(8, targetRect.top - tooltipRect.height - 8);
      uiTooltip.style.left = left + "px";
      uiTooltip.style.top = top + "px";
    }

    function hideTooltip() { uiTooltip.hidden = true; }

    function renderFeatureTree() {
      const query = featureSearch.value.trim().toLowerCase();
      featureTree.innerHTML = "";
      const visibleGroups = groups.map((group) => ({
        ...group,
        visibleModules: group.modules.map((key) => modules.find((module) => module.key === key)).filter((module) => {
          return !query || [module.id, module.title, module.goal].join(" ").toLowerCase().includes(query);
        })
      })).filter((group) => group.visibleModules.length);

      if (!visibleGroups.length) {
        featureTree.innerHTML = '<li class="empty-tree">没有匹配的功能模块。</li>';
        return;
      }

      visibleGroups.forEach((group) => {
        const open = query ? true : expandedGroups.has(group.id);
        const li = document.createElement("li");
        li.className = "feature-group";
        li.innerHTML = [
          '<button class="group-button" type="button" data-group="' + group.id + '" aria-expanded="' + open + '">',
          '<span class="chevron"><i data-lucide="chevron-down"></i></span>',
          '<span>' + group.title + '</span>',
          '<span class="question-count">' + group.visibleModules.length + '</span>',

          '<ul class="feature-children" ' + (open ? '' : 'hidden') + '>',
          group.visibleModules.map((module) => '<li><button class="module-button ' + (module.key === activeModuleKey ? 'is-active' : '') + '" type="button" data-module="' + module.key + '"><span class="module-main"><span class="status-dot ' + module.status + '"></span><span class="module-name">' + module.id + ' ' + module.title + '</span></span><span class="question-count" title="' + module.questions.length + ' 个待定问题">' + module.questions.length + '</span></button></li>').join(""),
          '</ul>'
        ].join("");
        featureTree.appendChild(li);
      });

      featureTree.querySelectorAll("[data-group]").forEach((button) => button.addEventListener("click", () => {
        const id = button.dataset.group;
        if (expandedGroups.has(id)) expandedGroups.delete(id); else expandedGroups.add(id);
        renderFeatureTree();
      }));
      featureTree.querySelectorAll("[data-module]").forEach((button) => button.addEventListener("click", () => selectModule(button.dataset.module)));
      refreshIcons();
    }

    function updateWorkbench(options = {}) {
      const module = currentModule();
      const group = currentGroup();
      const element = currentElement();
      const locationParams = new URLSearchParams(location.search);
      locationParams.set("module", module.key);
      if (activeElementKey) locationParams.set("element", activeElementKey); else locationParams.delete("element");
      if (module.key === "save-panel" && activePopupState) locationParams.set("popup-state", activePopupState); else locationParams.delete("popup-state");
      history.replaceState(null, "", location.pathname + "?" + locationParams.toString());
      document.getElementById("breadcrumb").textContent = group.title + " / " + module.id;
      document.getElementById("canvas-title").textContent = element ? element.title : module.id + " " + module.title;
      const chip = document.getElementById("selection-chip");

    }

    function settingsMarkup() {
      return '<section class="floating-panel settings-panel is-selected-surface"><div class="floating-head"><span>Dock 设置</span><small>当前单层结构</small></div><div class="floating-body"><div class="setting-row"><span>显示站点名称</span><span class="mini-control"><button class="mini-option active" type="button">开</button><button class="mini-option" type="button">关</button></span></div><div class="setting-row"><span>图标尺寸</span><span class="mini-control"><button class="mini-option" type="button">小</button><button class="mini-option active" type="button">中</button><button class="mini-option" type="button">大</button></span></div><div class="setting-row"><span>站点管理</span><span class="mini-control"><button class="mini-option" type="button">进入</button></span></div></div></section>';
    }

    function bindPrototypeEvents() {
      prototypeFrame.querySelectorAll("[data-scene-module]").forEach((element) => element.addEventListener("click", (event) => {
        event.stopPropagation();
        let createdNow = false;
        if (element.dataset.sceneModule === "save-panel" && !currentBookmarkSaved) {
          currentBookmarkSaved = true;
          savedCount += 1;
          popupFolder = popupFolders[0];
          popupTags.clear();
          createdNow = true;
        }
        selectModule(element.dataset.sceneModule);
        if (element.dataset.sceneModule === "save-panel") showPrototypeToast(createdNow ? "Bookmark 已创建，抖音 Dock 数量已更新" : "已恢复 Bookmark，Dock 数量不变");
      }));
      prototypeFrame.querySelectorAll("[data-site-index]").forEach((element) => element.addEventListener("click", (event) => {
        event.stopPropagation();
        selectModule("collection-panel");
      }));
      prototypeFrame.querySelectorAll("[data-element]").forEach((element) => element.addEventListener("click", (event) => {
        event.stopPropagation();
        if (element.dataset.element === "done") {
          selectModule("browser-shell");
          showPrototypeToast("Popup 已关闭，已确认操作不会丢失");
          return;
        }
        if (element.dataset.element === "cancel") {
          if (currentBookmarkSaved) savedCount = Math.max(0, savedCount - 1);
          currentBookmarkSaved = false;
          popupFolder = popupFolders[0];
          popupTags.clear();
          selectModule("domain-dock");
          showPrototypeToast("Bookmark 已删除，抖音 Dock 数量已更新");
          return;
        }
        if (element.dataset.element === "folder") {
          popupFolder = popupFolders[(popupFolders.indexOf(popupFolder) + 1) % popupFolders.length];
          activeModuleKey = "save-panel";
          activeElementKey = "folder";
          updateWorkbench();
          showPrototypeToast("收藏夹已即时替换，Dock 数量不变");
          return;
        }
        selectElement("save-panel", element.dataset.element);
      }));
      prototypeFrame.querySelectorAll("[data-popup-tag]").forEach((button) => button.addEventListener("click", (event) => {
        event.stopPropagation();
        const tag = button.dataset.popupTag;
        if (popupTags.has(tag)) popupTags.delete(tag); else popupTags.add(tag);
        activeModuleKey = "save-panel";
        activeElementKey = "tags";
        updateWorkbench();
        showPrototypeToast("标签已即时保存，Dock 数量不变");
      }));
      prototypeFrame.querySelectorAll("[data-tag-filter]").forEach((button) => button.addEventListener("click", (event) => {
        event.stopPropagation();
        activeModuleKey = "tag-filter";
        activeElementKey = null;
        activeTag = button.dataset.tagFilter;
        updateWorkbench();
      }));
      prototypeFrame.querySelectorAll("[data-open-menu]").forEach((button) => button.addEventListener("click", (event) => {
        event.stopPropagation();
        selectModule("context-menu");
      }));
    }

    function showPrototypeToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      prototypeFrame.appendChild(toast);
      setTimeout(() => toast.remove(), 1800);
    }

    function renderInspector() {
      const module = currentModule();
      const element = currentElement();
      if (element) {
        inspectorContent.innerHTML = [
          '<div class="inspector-summary"><div class="status-line"><span class="status-label">界面元素</span><span class="section-count">' + module.id + ' ' + module.title + '</span></div><p class="summary-goal">' + element.rule + '</p></div>',
          '<section class="inspector-section"><div class="section-heading"><h2>元素属性</h2></div><dl class="property-grid"><dt>控件类型</dt><dd>' + element.type + '</dd><dt>是否必需</dt><dd>' + element.required + '</dd><dt>数据来源</dt><dd>' + element.source + '</dd></dl></section>',
          '<section class="inspector-section"><div class="section-heading"><h2>交互规则</h2></div><ul class="requirement-list"><li>' + element.interaction + '</li></ul></section>',
          '<section class="inspector-section"><div class="section-heading"><h2>待讨论</h2><span class="section-count">' + element.questions.length + '</span></div><ul class="question-list">' + element.questions.map((item) => '<li>' + item + '</li>').join("") + '</ul></section>',
          noteDetails(module)
        ].join("");
      } else {
        inspectorContent.innerHTML = [
          '<div class="inspector-summary"><div class="status-line"><span class="status-label ' + module.status + '">' + module.statusLabel + '</span><span class="section-count">' + currentGroup().title + '</span></div><p class="summary-goal">' + module.goal + '</p></div>',
          '<section class="inspector-section"><div class="section-heading"><h2>来源与范围</h2></div><dl class="property-grid"><dt>范围层级</dt><dd>' + (["M01","M02","M03","M04","M05","M06","M07"].includes(module.id) ? '首版核心链路' : (module.id === 'M08' ? '基础环境已冻结' : '已冻结支撑模块')) + '</dd><dt>来源索引</dt><dd>requirements/source-map.md</dd><dt>Figma 证据</dt><dd>' + figmaEvidence(module) + '</dd></dl></section>',
          sectionList("已确定", module.confirmed, "requirement-list"),
          contentSection(module),
          sectionList("关键交互", module.interactions, "requirement-list"),
          sectionList("状态", module.states, "requirement-list"),
          sectionList("待讨论", module.questions, "question-list"),
          detailsList("当前不做", module.notDo),
          changesDetails(module),
          noteDetails(module)
        ].join("");
      }
      bindInspectorNotes(module);
    }

    function figmaEvidence(module) {
      if (!module.figma?.length) return '<span>暂无已验证专用节点</span>';
      const base = 'https://www.figma.com/design/5ies7QmEhABMFUwK1khOua/Duck-Newtab-Desktop?m=dev&node-id=';
      return '<span class="figma-links">' + module.figma.map((item) => '<a href="' + base + item[1] + '" target="_blank" rel="noreferrer">' + item[0] + '</a>').join('') + '</span>';
    }

    function sectionList(title, items, className) {
      return '<section class="inspector-section"><div class="section-heading"><h2>' + title + '</h2><span class="section-count">' + items.length + '</span></div><ul class="' + className + '">' + items.map((item) => '<li>' + item + '</li>').join("") + '</ul></section>';
    }

    function contentSection(module) {
      return '<section class="inspector-section"><div class="section-heading"><h2>界面内容</h2><span class="section-count">' + module.content.length + '</span></div><table class="content-table"><thead><tr><th>内容</th><th>说明</th><th>必需</th></tr></thead><tbody>' + module.content.map((row) => '<tr><td>' + row[0] + '</td><td>' + row[1] + '</td><td>' + (row[2] ? '<span class="required-mark">是</span>' : '否') + '</td></tr>').join("") + '</tbody></table></section>';
    }

    function detailsList(title, items) {
      return '<details class="inspector-details"><summary>' + title + '<span>' + items.length + '</span></summary><div class="details-body"><ul class="requirement-list">' + items.map((item) => '<li>' + item + '</li>').join("") + '</ul></div></details>';
    }

    function changesDetails(module) {
      return '<details class="inspector-details"><summary>变更记录<span>' + module.changes.length + '</span></summary><div class="details-body">' + module.changes.map((change) => '<div class="change-row"><span class="change-date">' + change[0] + '</span><span>' + change[1] + '</span></div>').join("") + '</div></details>';
    }

    function noteDetails(module) {
      return '<details class="inspector-details"><summary>讨论记录<span>本地</span></summary><div class="details-body"><textarea class="note-area" id="module-note" placeholder="记录补充、备选方案、反例或需要 Codex 整理的内容。"></textarea><p class="note-hint">仅保存在当前浏览器，不替代 Markdown 正式需求。</p></div></details>';
    }

    function bindInspectorNotes(module) {
      const note = document.getElementById("module-note");
      if (!note) return;
      const key = "zero-workbench-v4-note-" + module.key;
      note.value = localStorage.getItem(key) || "";
      note.addEventListener("input", () => localStorage.setItem(key, note.value));
    }

    function updateFrameSize() {
      prototypeFrame.style.width = frameWidth + "px";
      prototypeFrame.style.height = Math.round(frameWidth * 1080 / 1912) + "px";
    }

    function updateZoom() {
      scale = Math.max(0.35, Math.min(1.4, scale));
      scaleWrap.style.width = Math.round(prototypeFrame.offsetWidth * scale) + "px";
      scaleWrap.style.height = Math.round(prototypeFrame.offsetHeight * scale) + "px";
      prototypeFrame.style.transform = "scale(" + scale + ")";
      document.getElementById("zoom-value").textContent = Math.round(scale * 100) + "%";
    }

    function fitCurrentFrame() {
      const availableW = Math.max(340, canvasScroll.clientWidth - 58);
      const availableH = Math.max(250, canvasScroll.clientHeight - 58);
      scale = Math.min(1, availableW / prototypeFrame.offsetWidth, availableH / prototypeFrame.offsetHeight);
      updateZoom();
    }

    function fitCanvas() {
      updateFrameSize();
      fitMode = true;
      viewportSelect.value = "fit";
      fitCurrentFrame();
    }

    function setViewport(value) {
      if (value === "fit") {
        fitCanvas();
        return;
      }
      frameWidth = Number(value);
      updateFrameSize();
      fitMode = false;
      scale = Math.min(1, (canvasScroll.clientWidth - 58) / prototypeFrame.offsetWidth, (canvasScroll.clientHeight - 58) / prototypeFrame.offsetHeight);
      updateZoom();
    }

    function initResizer(element, side) {
      let dragging = false;
      let activePointerId = null;
      const property = side === "left" ? "--left-w" : "--right-w";
      const min = side === "left" ? 218 : 286;
      const max = side === "left" ? 420 : 520;
      const currentWidth = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(property));
      const applyWidth = (width) => {
        const next = Math.max(min, Math.min(max, width));
        document.documentElement.style.setProperty(property, next + "px");
        element.setAttribute("aria-valuenow", String(Math.round(next)));
        element.setAttribute("aria-valuetext", Math.round(next) + " 像素");
        return next;
      };
      const finishDrag = (event) => {
        if (!dragging) return;
        if (event?.pointerId != null && activePointerId != null && event.pointerId !== activePointerId) return;
        dragging = false;
        activePointerId = null;
        element.classList.remove("is-dragging");
        document.body.style.userSelect = "";
        if (fitMode) fitCanvas(); else fitCurrentFrame();
      };
      applyWidth(currentWidth());
      element.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        dragging = true;
        activePointerId = event.pointerId;
        element.classList.add("is-dragging");
        document.body.style.userSelect = "none";
      });
      window.addEventListener("pointerup", finishDrag);
      window.addEventListener("pointercancel", finishDrag);
      window.addEventListener("pointermove", (event) => {
        if (!dragging || event.pointerId !== activePointerId) return;
        applyWidth(side === "left" ? event.clientX : window.innerWidth - event.clientX);
      });
      element.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        event.preventDefault();
        const direction = event.key === "ArrowRight" ? 1 : -1;
        applyWidth(currentWidth() + direction * (side === "left" ? 12 : -12));
        if (fitMode) fitCanvas(); else fitCurrentFrame();
      });
      return () => applyWidth(currentWidth());
    }

    function setPane(side, visible) {
      if (visible && window.innerWidth <= 900) {
        const other = side === "left" ? "right" : "left";
        document.body.classList.add(other + "-hidden");
      }
      document.body.classList.toggle(side + "-hidden", !visible);
      syncPaneControls();
      requestAnimationFrame(() => { if (fitMode) fitCanvas(); else fitCurrentFrame(); });
    }

    function syncPaneControls() {
      ["left", "right"].forEach((side) => {
        const visible = !document.body.classList.contains(side + "-hidden");
        document.getElementById("toggle-" + side).setAttribute("aria-pressed", String(visible));
        document.getElementById(side + "-pane").setAttribute("aria-hidden", String(!visible));
      });
      document.getElementById("focus-canvas").setAttribute("aria-pressed", String(document.body.classList.contains("left-hidden") && document.body.classList.contains("right-hidden")));
    }

    function currentResponsiveMode() {
      if (window.innerWidth <= 900) return "narrow";
      if (window.innerWidth <= 1180) return "compact";
      return "wide";
    }

    function applyResponsiveDefaults() {
      const nextMode = currentResponsiveMode();
      if (nextMode === responsiveMode) return;
      responsiveMode = nextMode;
      if (nextMode === "wide") {
        document.body.classList.remove("left-hidden", "right-hidden");
      } else if (nextMode === "compact") {
        document.body.classList.remove("left-hidden");
        document.body.classList.add("right-hidden");
      } else {
        document.body.classList.add("left-hidden", "right-hidden");
      }
      syncPaneControls();
    }

    featureSearch.addEventListener("input", renderFeatureTree);
    document.getElementById("collapse-groups").addEventListener("click", () => {
      if (expandedGroups.size) expandedGroups.clear(); else expandedGroups = new Set(groups.map((group) => group.id));
      renderFeatureTree();
    });
    viewportSelect.addEventListener("change", () => setViewport(viewportSelect.value));
    popupStateSelect.addEventListener("change", () => {
      activeModuleKey = "save-panel";
      activeElementKey = null;
      activePopupState = popupStateSelect.value;
      updateWorkbench();
    });
    document.getElementById("zoom-in").addEventListener("click", () => { fitMode = false; scale += 0.1; updateZoom(); });
    document.getElementById("zoom-out").addEventListener("click", () => { fitMode = false; scale -= 0.1; updateZoom(); });
    document.getElementById("zoom-value").addEventListener("click", () => { fitMode = false; scale = 1; updateZoom(); });
    document.getElementById("zoom-fit").addEventListener("click", fitCanvas);
    document.getElementById("toggle-left").addEventListener("click", () => setPane("left", document.body.classList.contains("left-hidden")));
    document.getElementById("toggle-right").addEventListener("click", () => setPane("right", document.body.classList.contains("right-hidden")));
    document.getElementById("close-right").addEventListener("click", () => setPane("right", false));
    document.addEventListener("pointerdown", (event) => {
      if (window.innerWidth > 900) return;
      ["left", "right"].forEach((side) => {
        if (document.body.classList.contains(side + "-hidden")) return;
        const pane = document.getElementById(side + "-pane");
        const toggle = document.getElementById("toggle-" + side);
        if (!pane.contains(event.target) && !toggle.contains(event.target)) setPane(side, false);
      });
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape" || window.innerWidth > 900) return;
      const side = !document.body.classList.contains("right-hidden") ? "right" : !document.body.classList.contains("left-hidden") ? "left" : null;
      if (!side) return;
      event.preventDefault();
      setPane(side, false);
      document.getElementById("toggle-" + side).focus({ preventScroll: true });
    });
    document.getElementById("focus-canvas").addEventListener("click", (event) => {
      const focus = event.currentTarget.getAttribute("aria-pressed") !== "true";
      event.currentTarget.setAttribute("aria-pressed", String(focus));
      setPane("left", !focus);
      setPane("right", !focus);
    });

    const syncLeftResizer = initResizer(document.getElementById("left-resizer"), "left");
    const syncRightResizer = initResizer(document.getElementById("right-resizer"), "right");
    window.addEventListener("resize", () => {
      applyResponsiveDefaults();
      syncLeftResizer();
      syncRightResizer();
      hideTooltip();
      if (fitMode) fitCanvas(); else fitCurrentFrame();
    });
    window.addEventListener("message", (event) => {
      if (event.origin !== location.origin || event.data?.type !== "zero-prototype-select") return;
      const iframe = document.getElementById("live-prototype-frame");
      if (!iframe || event.source !== iframe.contentWindow) return;
      if (!modules.some((module) => module.key === event.data.module)) return;
      activeModuleKey = event.data.module;
      activeElementKey = event.data.element || null;
      if (activeModuleKey !== "tag-filter") activeTag = "all";
      updateWorkbench({ skipPrototype: true });
    });

    updateFrameSize();
    applyResponsiveDefaults();
    updateWorkbench();
    refreshIcons();
    requestAnimationFrame(fitCanvas);
  </script>
</body>
</html>
